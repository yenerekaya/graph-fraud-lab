[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-fraud-lab"
version = "0.2.0"
description = "An explainable, reproducible transaction graph investigation lab"
requires-python = ">=3.11"
dependencies = ["networkx>=3.4,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
graph-fraud-lab = "graph_fraud_lab.cli:main"

[tool.setuptools.package-data]
graph_fraud_lab = ["dashboard.html", "dashboard-core.js", "*.cypher"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
